<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SakuPintar</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SakuPintar">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
  >

  <!-- Custom Style -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">

<!-- ================= NAVBAR ================= -->

<nav class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

    <h1 class="text-xl font-bold flex items-center gap-2">
      <i class="fas fa-wallet"></i>
      SakuPintar
    </h1>

    <div
      id="totalBalanceHeader"
      class="text-sm font-medium bg-indigo-700 px-3 py-1 rounded-full"
    >
      Total Saldo: Rp 0
    </div>

  </div>
</nav>

<!-- ================= MAIN ================= -->

<main class="max-w-6xl mx-auto px-4 py-8">

  <!-- Stats -->
  <div
    id="statsCards"
    class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"
  ></div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

    <!-- Pocket Sidebar -->
    <div class="lg:col-span-4">
      <div class="glass p-6 rounded-2xl shadow-sm border">

        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-gray-800">Daftar Kantong</h2>

          <button
            onclick="toggleModal('pocketModal')"
            class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold"
          >
            <i class="fas fa-plus-circle"></i>
            Tambah
          </button>
        </div>

        <div id="pocketList" class="space-y-3"></div>

      </div>
    </div>

    <!-- Transaction Area -->
    <div class="lg:col-span-8">
      <div class="glass p-6 rounded-2xl shadow-sm border min-h-[500px]">

        <!-- Header -->
        <div
          class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
        >

          <div>
            <h2
              id="currentPocketTitle"
              class="font-bold text-xl text-gray-800"
            >
              Semua Transaksi
            </h2>

            <p
              id="currentPocketDesc"
              class="text-sm text-gray-500"
            >
              Kelola arus kas Anda dengan bijak
            </p>
          </div>

          <button
            onclick="openTransactionModal()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-all flex items-center gap-2"
          >
            <i class="fas fa-plus"></i>
            Transaksi Baru
          </button>

        </div>

        <!-- Table -->
        <div class="overflow-x-auto">

          <table class="w-full text-left">
            <thead>
              <tr class="text-gray-400 text-xs uppercase border-b">
                <th class="pb-3">Tanggal</th>
                <th class="pb-3">Keterangan</th>
                <th class="pb-3 text-right">Nominal</th>
                <th class="pb-3 text-center">Aksi</th>
              </tr>
            </thead>

            <tbody
              id="transactionBody"
              class="divide-y"
            ></tbody>

          </table>

          <!-- Empty State -->
          <div
            id="emptyState"
            class="hidden py-20 text-center text-gray-400"
          >
            <i class="fas fa-receipt text-4xl mb-3 opacity-20"></i>
            <p>Belum ada transaksi di kantong ini.</p>
          </div>

        </div>

      </div>
    </div>

  </div>

</main>

<!-- ================= POCKET MODAL ================= -->

<div
  id="pocketModal"
  class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-[60] p-4"
>

  <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">

    <h3 class="text-lg font-bold mb-4">Buat Kantong Baru</h3>

    <div class="space-y-4">

      <input
        type="text"
        id="pocketName"
        placeholder="Nama Kantong"
        class="w-full border rounded-lg px-3 py-2"
      >

      <!-- Icon Preview -->
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">Icon dipilih:</span>
        <div
          id="selectedIconPreview"
          class="text-xl text-indigo-600"
        >
          <i class="fas fa-wallet"></i>
        </div>
      </div>

      <!-- Icon Picker -->
      <div
        id="iconPicker"
        class="grid grid-cols-5 gap-3"
      ></div>

      <!-- Hidden Input -->
      <input type="hidden" id="pocketIcon" value="fa-wallet">

    </div>

    <div class="mt-6 flex gap-3">

      <button
        onclick="toggleModal('pocketModal')"
        class="flex-1 px-4 py-2 border rounded-lg"
      >
        Batal
      </button>

      <button
        onclick="addPocket()"
        class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg"
      >
        Simpan
      </button>

    </div>

  </div>
</div>

<!-- ================= TRANSACTION MODAL ================= -->

<div
  id="transactionModal"
  class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-[60] p-4"
>

  <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">

    <h3
      id="txModalTitle"
      class="text-lg font-bold mb-4"
    >
      Tambah Transaksi
    </h3>

    <form id="txForm" class="space-y-4">

      <div class="grid grid-cols-2 gap-4">

        <button
          type="button"
          id="btnTypeIn"
          onclick="setTxType('in')"
          class="py-2 rounded-lg border-2 border-emerald-500 bg-emerald-50 text-emerald-600 font-bold"
        >
          Pemasukan
        </button>

        <button
          type="button"
          id="btnTypeOut"
          onclick="setTxType('out')"
          class="py-2 rounded-lg bg-gray-100 text-gray-600 font-bold"
        >
          Pengeluaran
        </button>

      </div>

      <input
        type="number"
        id="txAmount"
        placeholder="Nominal"
        required
        class="w-full border rounded-lg px-3 py-2"
      >

      <input
        type="text"
        id="txNote"
        placeholder="Keterangan"
        required
        class="w-full border rounded-lg px-3 py-2"
      >

      <input
        type="date"
        id="txDate"
        required
        class="w-full border rounded-lg px-3 py-2"
      >

    </form>

    <div class="mt-6 flex gap-3">

      <button
        onclick="toggleModal('transactionModal')"
        class="flex-1 px-4 py-2 border rounded-lg"
      >
        Batal
      </button>

      <button
        onclick="saveTransaction()"
        class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg"
      >
        Simpan
      </button>

    </div>

  </div>
</div>

<!-- ================= SCRIPTS ================= -->

<script src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('./sw.js')
        .then(reg => console.log('Service Worker registered:', reg))
        .catch(err => console.log('Service Worker error:', err));
    });
  }
</script>

</body>
</html>
